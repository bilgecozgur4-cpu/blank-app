name: Build OZBILTAR APK

on:
  workflow_dispatch:
  push:
    branches: [ main ]
    paths:
      - "ozbiltar/payload/**"
      - "ozbiltar/payload_fix/**"
      - "ozbiltar/v6_overlay_*.b64"
      - ".github/workflows/build-ozbiltar-apk.yml"

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Verify and expand base project
        shell: bash
        run: |
          rm -rf ozbiltar/buildsrc
          mkdir -p ozbiltar/buildsrc
          cat \
            ozbiltar/payload/part00.b64 \
            ozbiltar/payload/part01.b64 \
            ozbiltar/payload/part02.b64 \
            ozbiltar/payload/part03.b64 \
            ozbiltar/payload/part04.b64 \
            ozbiltar/payload/part05.b64 \
            ozbiltar/payload/part06.b64 \
            ozbiltar/payload_fix/part07a.b64 \
            ozbiltar/payload_fix/part07b.b64 \
            ozbiltar/payload/part08.b64 \
            ozbiltar/payload/part09.b64 \
            ozbiltar/payload/part10.b64 \
            ozbiltar/payload/part11.b64 \
            ozbiltar/payload_fix/part12a.b64 \
            ozbiltar/payload_fix/part12b.b64 \
            ozbiltar/payload/part13.b64 \
            ozbiltar/payload/part14.b64 \
            > ozbiltar/project.full.b64
          test "$(wc -c < ozbiltar/project.full.b64)" -eq 84812
          base64 -d ozbiltar/project.full.b64 > ozbiltar/project.tar.gz
          gzip -t ozbiltar/project.tar.gz
          tar -xzf ozbiltar/project.tar.gz -C ozbiltar/buildsrc
          test -f ozbiltar/buildsrc/android-native/app/build.gradle

      - name: Overlay V6 mobile source
        shell: bash
        run: |
          cat ozbiltar/v6_overlay_a.b64 ozbiltar/v6_overlay_b.b64 > ozbiltar/v6_overlay.full.b64
          echo "V6 overlay chars: $(wc -c < ozbiltar/v6_overlay.full.b64)"
          test "$(wc -c < ozbiltar/v6_overlay.full.b64)" -eq 36164
          base64 -d ozbiltar/v6_overlay.full.b64 > ozbiltar/v6_overlay.tar.gz
          gzip -t ozbiltar/v6_overlay.tar.gz
          tar -xzf ozbiltar/v6_overlay.tar.gz -C ozbiltar/buildsrc
          cd ozbiltar/buildsrc
          node --check js/app.js
          node --check js/config.js
          node --check js/storage.js
          grep 'quick-entry-grid' index.html
          grep 'versionName "6.0.0"' android-native/app/build.gradle
          grep 'android:windowSoftInputMode="adjustResize"' android-native/app/src/main/AndroidManifest.xml
          grep 'android.print.PrintManager' android-native/app/src/main/java/com/ozbiltar/yonetim/MainActivity.java
          grep '@color/oz_navy' android-native/app/src/main/res/drawable/splash_background.xml

      - name: Sync V6 web app into Android assets
        shell: bash
        run: |
          cd ozbiltar/buildsrc
          WWW=android-native/app/src/main/assets/www
          rm -rf "$WWW/assets" "$WWW/js"
          mkdir -p "$WWW"
          cp index.html manifest.webmanifest sw.js "$WWW/"
          cp -r assets js "$WWW/"
          test -f "$WWW/js/app.js"
          grep 'mobileFab' "$WWW/index.html"
          grep 'MOBILE-FIRST DATA ENTRY' "$WWW/assets/styles.css"
          grep 'openRecordModal(recordId=null,moduleKey=null,preset={})' "$WWW/js/app.js"

      - name: Build V6 debug APK
        working-directory: ozbiltar/buildsrc/android-native
        run: gradle assembleDebug --stacktrace

      - name: Upload V6 APK
        uses: actions/upload-artifact@v4
        with:
          name: OZBILTAR-Yonetim-AI-Pro-V6-mobile-debug
          path: ozbiltar/buildsrc/android-native/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
