# build-revision: v7.4-qr-import-fix
name: Build OZBILTAR APK

on:
  workflow_dispatch:
  push:
    branches: [ main ]
    paths:
      - "ozbiltar/**"
      - ".github/workflows/build-ozbiltar-apk.yml"

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Reconstruct base project
        shell: bash
        run: |
          rm -rf ozbiltar/buildsrc && mkdir -p ozbiltar/buildsrc
          cat \
            ozbiltar/payload/part00.b64 ozbiltar/payload/part01.b64 ozbiltar/payload/part02.b64 \
            ozbiltar/payload/part03.b64 ozbiltar/payload/part04.b64 ozbiltar/payload/part05.b64 \
            ozbiltar/payload/part06.b64 ozbiltar/payload_fix/part07a.b64 ozbiltar/payload_fix/part07b.b64 \
            ozbiltar/payload/part08.b64 ozbiltar/payload/part09.b64 ozbiltar/payload/part10.b64 \
            ozbiltar/payload/part11.b64 ozbiltar/payload_fix/part12a.b64 ozbiltar/payload_fix/part12b.b64 \
            ozbiltar/payload/part13.b64 ozbiltar/payload/part14.b64 > ozbiltar/project.full.b64
          test "$(wc -c < ozbiltar/project.full.b64)" -eq 84812
          base64 -d ozbiltar/project.full.b64 > ozbiltar/project.tar.gz
          gzip -t ozbiltar/project.tar.gz
          tar -xzf ozbiltar/project.tar.gz -C ozbiltar/buildsrc

      - name: Apply V6 mobile source
        shell: bash
        run: |
          cat ozbiltar/v6_overlay_a.b64 ozbiltar/v6_overlay_b.b64 > ozbiltar/v6_overlay.full.b64
          test "$(wc -c < ozbiltar/v6_overlay.full.b64)" -eq 36164
          base64 -d ozbiltar/v6_overlay.full.b64 > ozbiltar/v6_overlay.tar.gz
          gzip -t ozbiltar/v6_overlay.tar.gz
          tar -xzf ozbiltar/v6_overlay.tar.gz -C ozbiltar/buildsrc

      - name: Apply V7.2 core
        shell: bash
        run: |
          cat \
            ozbiltar/v7_2_overlay_00.b64 ozbiltar/v7_2_overlay_01.b64 \
            ozbiltar/v7_2_overlay_02a.b64 ozbiltar/v7_2_overlay_02b.b64 \
            ozbiltar/v7_2_overlay_03.b64 ozbiltar/v7_2_overlay_04.b64 > ozbiltar/v7_2_overlay.full.b64
          test "$(wc -c < ozbiltar/v7_2_overlay.full.b64)" -eq 46456
          base64 -d ozbiltar/v7_2_overlay.full.b64 > ozbiltar/v7_2_overlay.tar.gz
          gzip -t ozbiltar/v7_2_overlay.tar.gz
          echo "f1a6198d40ff41cbd8a1d95c13b5536878ee0d0a37ff6a360d9b5f0a1967b174  ozbiltar/v7_2_overlay.tar.gz" | sha256sum -c -
          tar -xzf ozbiltar/v7_2_overlay.tar.gz -C ozbiltar/buildsrc

      - name: Apply V7.3 business suite
        shell: bash
        run: |
          cp ozbiltar/v73.js ozbiltar/buildsrc/js/v73.js
          cp ozbiltar/v73_app_block.txt ozbiltar/buildsrc/v73_app_block.txt
          cp ozbiltar/apply_v73.py ozbiltar/buildsrc/apply_v73.py
          cd ozbiltar/buildsrc && python apply_v73.py

      - name: Apply V7.4 company suite and QR fix
        shell: bash
        run: |
          cp ozbiltar/v74/v74.js ozbiltar/buildsrc/js/v74.js
          cp ozbiltar/v74/v74-ui.js ozbiltar/buildsrc/js/v74-ui.js
          python ozbiltar/v74/apply_v74.py ozbiltar/buildsrc
          python ozbiltar/v74/fix_qr_import.py ozbiltar/buildsrc
          cat ozbiltar/v74/v74.css.add >> ozbiltar/buildsrc/assets/styles.css
          cd ozbiltar/buildsrc
          node --check js/app.js
          node --check js/storage.js
          node --check js/v74.js
          node --check js/v74-ui.js
          grep 'Kullanıcı & Yetki Merkezi' index.html
          grep 'Belge & Fotoğraf Merkezi' index.html
          grep 'Hayvan QR Merkezi' index.html
          grep 'Gelişmiş Sürü Performansı' index.html
          grep 'Bulut Senkronizasyonu' index.html
          grep 'com.google.zxing.integration.android.IntentIntegrator' android-native/app/src/main/java/com/ozbiltar/yonetim/MainActivity.java
          grep 'versionName "7.4.0"' android-native/app/build.gradle

      - name: Ensure Android launcher icon and splash
        shell: bash
        run: |
          RES=ozbiltar/buildsrc/android-native/app/src/main/res
          mkdir -p "$RES/mipmap" "$RES/drawable"
          cat > "$RES/mipmap/ic_launcher.xml" <<'EOF'
          <vector xmlns:android="http://schemas.android.com/apk/res/android" android:width="108dp" android:height="108dp" android:viewportWidth="108" android:viewportHeight="108">
            <path android:fillColor="#122033" android:pathData="M0,0h108v108h-108z"/>
            <path android:fillColor="#D9B985" android:pathData="M15,39C24,18 38,11 54,11C70,11 84,18 93,39L82,44C75,29 65,23 54,23C43,23 33,29 26,44Z"/>
            <path android:fillColor="#D9B985" android:pathData="M18,80C38,52 61,43 91,45C70,52 52,64 39,80Z"/>
            <path android:fillColor="#FFFFFF" android:pathData="M33,45C40,40 46,38 54,38C62,38 68,40 75,45L70,55C65,52 60,51 54,51C48,51 43,52 38,55Z"/>
          </vector>
          EOF
          cat > "$RES/drawable/splash_background.xml" <<'EOF'
          <layer-list xmlns:android="http://schemas.android.com/apk/res/android">
            <item android:drawable="@color/oz_navy"/>
            <item android:drawable="@mipmap/ic_launcher" android:gravity="center"/>
          </layer-list>
          EOF

      - name: Sync V7.4 web app into Android assets
        shell: bash
        run: |
          cd ozbiltar/buildsrc
          WWW=android-native/app/src/main/assets/www
          rm -rf "$WWW/assets" "$WWW/js"
          mkdir -p "$WWW"
          cp index.html manifest.webmanifest sw.js "$WWW/"
          cp -r assets js "$WWW/"
          test -f "$WWW/js/v74.js" && test -f "$WWW/js/v74-ui.js"
          grep 'Kullanıcı & Yetki Merkezi' "$WWW/index.html"
          grep 'Hayvan QR Merkezi' "$WWW/index.html"
          grep 'Bulut Senkronizasyonu' "$WWW/index.html"

      - name: Build V7.4 debug APK
        working-directory: ozbiltar/buildsrc/android-native
        run: gradle assembleDebug --stacktrace

      - name: Upload V7.4 APK
        uses: actions/upload-artifact@v4
        with:
          name: OZBILTAR-Yonetim-AI-Pro-V7.4-debug
          path: ozbiltar/buildsrc/android-native/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
