name: Build OZBILTAR APK

on:
  workflow_dispatch:
  push:
    branches: [ main ]
    paths:
      - "ozbiltar/payload/**"
      - "ozbiltar/payload_fix/**"
      - "ozbiltar/v6_overlay_*.b64"
      - "ozbiltar/apply_v7_lists.py"
      - ".github/workflows/build-ozbiltar-apk.yml"

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Verify and expand base project
        shell: bash
        run: |
          rm -rf ozbiltar/buildsrc
          mkdir -p ozbiltar/buildsrc
          cat \
            ozbiltar/payload/part00.b64 \
            ozbiltar/payload/part01.b64 \
            ozbiltar/payload/part02.b64 \
            ozbiltar/payload/part03.b64 \
            ozbiltar/payload/part04.b64 \
            ozbiltar/payload/part05.b64 \
            ozbiltar/payload/part06.b64 \
            ozbiltar/payload_fix/part07a.b64 \
            ozbiltar/payload_fix/part07b.b64 \
            ozbiltar/payload/part08.b64 \
            ozbiltar/payload/part09.b64 \
            ozbiltar/payload/part10.b64 \
            ozbiltar/payload/part11.b64 \
            ozbiltar/payload_fix/part12a.b64 \
            ozbiltar/payload_fix/part12b.b64 \
            ozbiltar/payload/part13.b64 \
            ozbiltar/payload/part14.b64 \
            > ozbiltar/project.full.b64
          test "$(wc -c < ozbiltar/project.full.b64)" -eq 84812
          base64 -d ozbiltar/project.full.b64 > ozbiltar/project.tar.gz
          gzip -t ozbiltar/project.tar.gz
          tar -xzf ozbiltar/project.tar.gz -C ozbiltar/buildsrc
          test -f ozbiltar/buildsrc/android-native/app/build.gradle

      - name: Overlay proven V6 mobile source
        shell: bash
        run: |
          cat ozbiltar/v6_overlay_a.b64 ozbiltar/v6_overlay_b.b64 > ozbiltar/v6_overlay.full.b64
          test "$(wc -c < ozbiltar/v6_overlay.full.b64)" -eq 36164
          base64 -d ozbiltar/v6_overlay.full.b64 > ozbiltar/v6_overlay.tar.gz
          gzip -t ozbiltar/v6_overlay.tar.gz
          tar -xzf ozbiltar/v6_overlay.tar.gz -C ozbiltar/buildsrc
          cd ozbiltar/buildsrc
          node --check js/app.js
          grep 'quick-entry-grid' index.html
          grep 'versionName "6.0.0"' android-native/app/build.gradle
          grep 'android:windowSoftInputMode="adjustResize"' android-native/app/src/main/AndroidManifest.xml

      - name: Apply V7.1 professional list center
        shell: bash
        run: |
          cp ozbiltar/apply_v7_lists.py ozbiltar/buildsrc/apply_v7_lists.py
          cd ozbiltar/buildsrc
          python apply_v7_lists.py
          node --check js/app.js
          node --check js/config.js
          grep 'id="listsView"' index.html
          grep 'id="dashboardListCards"' index.html
          grep 'Hayvan Listesi' js/app.js
          grep 'Stok Listesi' js/app.js
          grep 'V7.1 — PROFESSIONAL MOBILE LISTS' assets/styles.css
          grep 'versionName "7.1.0"' android-native/app/build.gradle

      - name: Ensure Android launcher icon and splash
        shell: bash
        run: |
          RES=ozbiltar/buildsrc/android-native/app/src/main/res
          mkdir -p "$RES/mipmap" "$RES/drawable"
          cat > "$RES/mipmap/ic_launcher.xml" <<'EOF'
          <vector xmlns:android="http://schemas.android.com/apk/res/android"
              android:width="108dp" android:height="108dp"
              android:viewportWidth="108" android:viewportHeight="108">
              <path android:fillColor="#122033" android:pathData="M0,0h108v108h-108z"/>
              <path android:fillColor="#D9B985" android:pathData="M15,39C24,18 38,11 54,11C70,11 84,18 93,39L82,44C75,29 65,23 54,23C43,23 33,29 26,44Z"/>
              <path android:fillColor="#D9B985" android:pathData="M18,80C38,52 61,43 91,45C70,52 52,64 39,80Z"/>
              <path android:fillColor="#FFFFFF" android:pathData="M33,45C40,40 46,38 54,38C62,38 68,40 75,45L70,55C65,52 60,51 54,51C48,51 43,52 38,55Z"/>
          </vector>
          EOF
          cat > "$RES/drawable/splash_background.xml" <<'EOF'
          <layer-list xmlns:android="http://schemas.android.com/apk/res/android">
            <item android:drawable="@color/oz_navy"/>
            <item android:drawable="@mipmap/ic_launcher" android:gravity="center"/>
          </layer-list>
          EOF

      - name: Sync V7.1 web app into Android assets
        shell: bash
        run: |
          cd ozbiltar/buildsrc
          WWW=android-native/app/src/main/assets/www
          rm -rf "$WWW/assets" "$WWW/js"
          mkdir -p "$WWW"
          cp index.html manifest.webmanifest sw.js "$WWW/"
          cp -r assets js "$WWW/"
          grep 'id="listsView"' "$WWW/index.html"
          grep 'business-list-item' "$WWW/assets/styles.css"
          grep 'recordIdentity' "$WWW/js/app.js"

      - name: Build V7.1 debug APK
        working-directory: ozbiltar/buildsrc/android-native
        run: gradle assembleDebug --stacktrace

      - name: Upload V7.1 APK
        uses: actions/upload-artifact@v4
        with:
          name: OZBILTAR-Yonetim-AI-Pro-V7.1-lists-debug
          path: ozbiltar/buildsrc/android-native/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
