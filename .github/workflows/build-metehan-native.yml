name: Build METEHAN Native APK

on:
  workflow_dispatch:
  push:
    branches: [metehan-v0.5-agent]
    paths:
      - 'metehan-android/**'
      - '.github/workflows/build-metehan-native.yml'

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: android-actions/setup-android@v3
      - name: Install Android SDK 36
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platform-tools" "platforms;android-36" "build-tools;35.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'
      - name: Prepare local METEHAN wake-word model
        run: bash metehan-android/prepare_kws.sh
      - name: Build debug APK
        working-directory: metehan-android
        run: gradle --no-daemon :app:assembleDebug
      - name: Stage APK
        run: |
          mkdir -p artifacts
          cp metehan-android/app/build/outputs/apk/debug/app-debug.apk artifacts/Metehan-v0.5-debug.apk
          sha256sum artifacts/Metehan-v0.5-debug.apk | tee artifacts/Metehan-v0.5-debug.apk.sha256
      - uses: actions/upload-artifact@v4
        with:
          name: Metehan-v0.5-debug-apk
          path: artifacts/*
          if-no-files-found: error
          retention-days: 30
