name: METEHAN core tests

on:
  push:
    branches: [metehan-v0.5-agent]
    paths:
      - 'metehan-core/**'
      - '.github/workflows/metehan-core-tests.yml'
  pull_request:
    paths:
      - 'metehan-core/**'

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: metehan-core
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --upgrade pip
      - run: pip install -r requirements.txt
      - run: python -m compileall -q .
      - run: python -m unittest discover -s tests -v
